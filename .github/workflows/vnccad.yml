# VNCCad: build the web (offline-capable PWA) and Windows/Linux desktop versions on every push
# to the vnccad branch, or on demand from the Actions tab. Download the results from the run's
# "Artifacts" section. Nothing here is signed and no secrets are used.
name: VNCCad build

on:
  push:
    branches: [vnccad, main]
    # VNCCad: a tag v* also publishes a GitHub Release with the packages and the test kit.
    tags: ['v*']
  workflow_dispatch:

env:
  TRUNK_VERSION: 0.21.14
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web (WebAssembly + PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: vnccad-web
      - name: Install trunk
        run: |
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" trunk
      - name: Build
        working-directory: apps/cadcraft-web
        run: trunk build --release
      - name: Add hosting files
        run: |
          cp packaging/web/_headers dist/web/
          cp packaging/web/vercel.json dist/web/
          ls -la dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: vnccad-web
          path: dist/web
          if-no-files-found: error

  web-test:
    name: Web self test (Chromium)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vnccad-web
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: packaging/web
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Run the self test
        working-directory: packaging/web
        run: |
          (cd "$GITHUB_WORKSPACE/site" && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          set -o pipefail
          node selftest.mjs http://localhost:8080/ | tee selftest.log
      - name: Report the self test
        if: always()
        working-directory: packaging/web
        run: |
          # Annotations show on the run page (and through the API) without opening the log.
          grep -E "SELFTEST|elapsed|busy|pageerror" selftest.log | head -20 | while IFS= read -r line; do
            echo "::notice title=Web self test::${line}"
          done
          { echo '### Web self test'; echo '```'; grep -E "SELFTEST|elapsed|busy|PASSED|FAILED" selftest.log; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vnccad-web-selftest
          path: packaging/web/selftest.png
          if-no-files-found: ignore

  windows:
    name: Windows x64 (portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: vnccad-windows
      - name: Build
        run: cargo build --release -p cadcraft -p cadcraft-cli
      - name: Collect
        shell: bash
        run: |
          mkdir -p out/VNCCad
          cp target/release/cadcraft.exe out/VNCCad/VNCCad.exe
          cp target/release/cadcraft-cli.exe out/VNCCad/vnccad-cli.exe
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md VNCCAD.md out/VNCCad/
      - uses: actions/upload-artifact@v4
        with:
          name: vnccad-windows-x64
          path: out/VNCCad
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: vnccad-linux
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Build
        run: cargo build --release -p cadcraft -p cadcraft-cli
      - name: Collect
        run: |
          mkdir -p out/VNCCad
          cp target/release/cadcraft out/VNCCad/vnccad
          cp target/release/cadcraft-cli out/VNCCad/vnccad-cli
          cp LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md VNCCAD.md out/VNCCad/
      - uses: actions/upload-artifact@v4
        with:
          name: vnccad-linux-x86_64
          path: out/VNCCad
          if-no-files-found: error

  pages:
    name: Deploy web lên GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vnccad-web
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Phát hành (Release) cho kỹ sư test
    needs: [web, windows, linux]
    # A tag v…, or a push to main whose commit message holds "[release v…]".
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="$(printf '%s' "$MSG" | grep -o '\[release v[^]]*\]' | head -1 | sed 's/^\[release //; s/\]$//')"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "V=${TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Test kit documents
        run: |
          pip install --quiet openpyxl
          mkdir -p kit
          python3 packaging/testkit/make_testkit.py "$V" kit
          cp -r packaging/testkit/mau kit/mau
      - name: Packages
        run: |
          mkdir -p dist
          # Windows: the app folder with the test kit inside.
          mkdir -p pkg/win && cp -r art/vnccad-windows-x64 pkg/win/VNCCad && cp -r kit/* pkg/win/VNCCad/
          (cd pkg/win && zip -qr "../../dist/VNCCad-$V-windows-x64.zip" VNCCad)
          # Linux: keep the executable bits (artifacts drop them).
          mkdir -p pkg/linux && cp -r art/vnccad-linux-x86_64 pkg/linux/VNCCad && cp -r kit/* pkg/linux/VNCCad/
          chmod +x pkg/linux/VNCCad/vnccad pkg/linux/VNCCad/vnccad-cli
          tar -C pkg/linux -czf "dist/VNCCad-$V-linux-x86_64.tar.gz" VNCCad
          # Web: the static site, for an internal server.
          (cd art/vnccad-web && zip -qr "../../dist/VNCCad-$V-web.zip" .)
          # The test kit alone.
          (cd kit && zip -qr "../dist/VNCCad-$V-bo-test.zip" .)
          cp kit/HUONG_DAN_TEST.html kit/PHIEU_TEST.xlsx dist/
          ls -la dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Bản thử nghiệm VNCCad $V cho kỹ sư test.

          - **Windows (offline):** VNCCad-$V-windows-x64.zip → giải nén, chạy VNCCad.exe
          - **Linux (offline):** VNCCad-$V-linux-x86_64.tar.gz → giải nén, chạy ./vnccad
          - **Web (online):** https://maitrieuquang-max.github.io/VNCCAD/ (cài được như ứng dụng, chạy cả khi mất mạng)
          - **Web cho máy chủ nội bộ:** VNCCad-$V-web.zip
          - **Bộ test:** HUONG_DAN_TEST.html, PHIEU_TEST.xlsx, thư mục mau/ (bản vẽ, lisp, CSV mẫu) — đã có sẵn trong gói Windows/Linux
          EOF
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "VNCCad $V (bản test)" --notes-file notes.md --prerelease
